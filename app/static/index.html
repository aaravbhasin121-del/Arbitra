<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arbitra — Auditable Hackathon Platform</title>
<style>
:root{
 --bg:#0b1422;--shell:#0a1220;--panel:#f5f0e6;--panel2:#eee7da;--line:#d6cdbd;--text:#17202b;--muted:#66717c;
 --navtext:#d8dee6;--navmuted:#9aa6b3;--primary:#a8843b;--primary2:#c39b4d;--navy:#10243b;--green:#2f6f55;--amber:#a06a22;--red:#8d3f3f;
 --white:#fffdf8;--shadow:0 12px 30px rgba(8,20,34,.10)
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#0b1422 0 74px,#eee9df 74px 100%);color:var(--text);min-height:100vh}
button,input,textarea,select{font:inherit}
.app{display:flex;min-height:100vh}.sidebar{width:252px;background:var(--shell);border-right:1px solid #1f3044;padding:22px 16px;position:fixed;inset:0 auto 0 0;z-index:3;box-shadow:8px 0 28px rgba(0,0,0,.10)}
.brand{display:flex;gap:11px;align-items:center;font-weight:800;font-size:21px;padding:8px 10px 26px;color:#f5f1e8;letter-spacing:.01em}.logo{width:35px;height:35px;border-radius:7px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:900;border:1px solid #d1b06a;box-shadow:none}
.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:var(--navmuted);text-align:left;padding:12px 13px;border-radius:5px}.nav button:hover,.nav button.active{background:#14283f;color:#fff;border-left:2px solid var(--primary);padding-left:11px}
.side-note{position:absolute;bottom:22px;left:20px;right:20px;color:#778596;font-size:12px;line-height:1.5}
.main{margin-left:252px;flex:1;min-width:0}.topbar{height:74px;background:#0b1422;border-bottom:1px solid #203248;color:#fff;padding:0 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:2}.topbar h1{font-family:Georgia,"Times New Roman",serif;font-size:23px;font-weight:600;margin:0;letter-spacing:.01em}.topbar .muted{color:#9aa6b3}
.content{padding:28px;max-width:1500px;margin:0 auto}.user{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;border-radius:50%;background:#e9dfcf;color:var(--navy);display:grid;place-items:center;font-weight:800;border:1px solid #b9a98d}.role{padding:5px 9px;border:1px solid #4a5a6b;border-radius:3px;color:#d7dde4;font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:20px;box-shadow:var(--shadow)}.card h2,.card h3{margin:0 0 12px;font-family:Georgia,"Times New Roman",serif;font-weight:600;color:#182533}.stat{font-size:30px;font-weight:800;margin-top:8px;color:#13243a}.muted{color:var(--muted)}.small{font-size:12px}.tag{display:inline-flex;align-items:center;padding:5px 8px;border-radius:3px;background:#e6ded0;color:#4d5963;font-size:11px;font-weight:750;letter-spacing:.03em}.tag.green{background:#dcebe2;color:var(--green)}.tag.amber{background:#f0e1ca;color:var(--amber)}.tag.red{background:#eedada;color:var(--red)}
.btn{border:1px solid var(--primary);border-radius:4px;padding:10px 14px;background:var(--primary);color:white;font-weight:750}.btn:hover{background:#92722f}.btn.secondary{background:transparent;border-color:#9b927f;color:#243444}.btn.ghost{background:transparent;color:#465361;border-color:#bdb4a4}.btn.danger{background:#7e3838;border-color:#7e3838}
input,textarea,select{width:100%;background:#fffdf8;border:1px solid #c9c0b0;color:#1c2935;border-radius:4px;padding:11px 12px;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(168,132,59,.13)}label{display:block;color:#4e5963;font-size:12px;font-weight:750;margin:12px 0 6px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions>*{flex:0 0 auto}
.table{width:100%;border-collapse:collapse;background:#fffdf8}.table th,.table td{padding:11px 9px;border-bottom:1px solid #ddd4c5;text-align:left;font-size:13px}.table th{color:#6c746f;text-transform:uppercase;font-size:10px;letter-spacing:.08em;background:#eee7da}.list{display:grid;gap:9px}.item{background:#fffdf8;border:1px solid #d8cfbf;border-radius:4px;padding:13px}.item:hover{border-color:#b8a57f}
.progress{height:7px;background:#d9d0c1;border-radius:2px;overflow:hidden}.progress>span{display:block;height:100%;background:var(--primary);border-radius:2px}
.notice{padding:12px 14px;border-radius:4px;background:#ece5d9;border:1px solid #d4c9b8;color:#4f5962}.notice.success{border-color:#9db9a9;background:#e4efe8;color:#2f634c}.notice.error{border-color:#c89b9b;background:#f3e2e2;color:#7d3a3a}
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0,#1a314b 0,#0b1422 55%)}.login-card{width:min(460px,100%);background:#f5f0e6;border:1px solid #c9bea9;border-radius:6px;padding:34px;box-shadow:0 25px 80px rgba(0,0,0,.32)}.login-logo{width:52px;height:52px;border-radius:7px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:23px;font-weight:900;margin-bottom:18px}.login-card h1{font-family:Georgia,"Times New Roman",serif;font-weight:600;color:#14263b}.login-card .eyebrow{color:#8a6b32}
.toast{position:fixed;right:22px;bottom:22px;background:#10243b;color:#fff;border:1px solid #38506a;padding:13px 16px;border-radius:4px;box-shadow:0 15px 45px rgba(0,0,0,.25);z-index:10}.hide{display:none}.hero{padding:24px;border-radius:5px;background:#10243b;color:#f7f2e9;border:1px solid #29425e}.hero h1{font-family:Georgia,"Times New Roman",serif;font-size:34px;font-weight:600;margin:0 0 8px;color:#fffaf0}.hero p{color:#c4cbd3;max-width:700px}.hero .muted{color:#aeb8c2}.metric-icon{font-size:20px;color:var(--primary2)}
.eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:#8a6b32}.subtitle{color:#66717c}.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
code{background:#e9e1d4;color:#374554;padding:2px 5px;border-radius:3px}.hero code{background:#203750;color:#e7edf3}
@media(max-width:900px){.sidebar{width:220px}.main{margin-left:220px}.content{padding:18px}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:680px){.sidebar{position:static;width:100%;height:auto}.main{margin-left:0}.app{display:block}.nav{grid-template-columns:repeat(2,1fr)}.side-note{display:none}.topbar{padding:0 16px}.content{padding:14px}.g2,.g3{grid-template-columns:1fr}}

</style>
</head>
<body>
<div id="toast" class="toast hide"></div>
<div id="root"></div>
<script>
const root=document.getElementById('root');let me=null,events=[],projects=[],selected=localStorage.getItem('selectedEvent')||'evt_01',page='dashboard';
const $=s=>document.querySelector(s);
async function api(url,opt={}){const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});const txt=await r.text();let d={};try{d=txt?JSON.parse(txt):{}}catch{d={raw:txt}}if(!r.ok)throw Error(d.detail||d.raw||('HTTP '+r.status));return d}
function toast(msg,ok=true){const t=$('#toast');t.textContent=msg;t.className='toast';t.style.borderColor=ok?'#245d48':'#6d2c38';setTimeout(()=>t.className='toast hide',2600)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function fmt(s){if(!s)return '—';try{return new Date(s).toLocaleString()}catch{return s}}
async function boot(){const auth=await api('/api/auth/me').catch(()=>null);me=auth?.user||auth;if(me) await loadData();render()}
async function loadData(){events=await api('/api/events/full').catch(()=>[]);projects=(await api('/api/gallery')).projects||[];if(!events.some(e=>e.id===selected)&&events[0])selected=events[0].id}
function login(){root.innerHTML=`<div class="login"><div class="login-card"><div class="login-logo">A</div><div class="eyebrow">DOGFOOD 2026</div><h1 style="margin:5px 0 8px">Welcome to Arbitra</h1><p class="subtitle">Run the event. Protect the judging. Explain the result.</p><label>Username</label><input id="lu" value="organizer"><label>Password</label><input id="lp" type="password" value="organizer123"><div class="actions"><button class="btn" onclick="doLogin()">Sign in</button></div><div class="notice" style="margin-top:16px"><b>Demo accounts</b><br>organizer / organizer123<br>judge_a / judge123 · judge_b / judge123<br>participant / participant123</div></div></div>`}
async function doLogin(){try{await api('/api/auth/login',{method:'POST',body:JSON.stringify({username:$('#lu').value,password:$('#lp').value})});toast('Signed in');boot()}catch(e){toast(e.message,false)}}
async function logout(){await api('/api/auth/logout',{method:'POST'});me=null;login()}
function navItem(id,label,icon){return `<button class="${page===id?'active':''}" onclick="go('${id}')">${icon} &nbsp;${label}</button>`}
function shell(content){
const initials=me.username.slice(0,1).toUpperCase();
return `<div class="app"><aside class="sidebar"><div class="brand"><div class="logo">A</div>Arbitra</div><div class="nav">
${navItem('dashboard','Overview','⌂')}${navItem('events','Events','◈')}${me.role==='organizer'?navItem('judging','Judging','◎'):''}${me.role==='judge'||me.role==='judge_a'||me.role==='judge_b'?navItem('workspace','My Judging','✓'):''}${me.role==='participant'?navItem('participant','My Hackathon','◇'):''}${navItem('gallery','Public Gallery','▦')}${me.role==='organizer'?navItem('integrity','Judging Lab','◉'):''}${navItem('api','API & Export','↗')}
</div><div class="side-note">Self-hosted · Offline-ready<br>Built for auditable judging</div></aside>
<main class="main"><div class="topbar"><div><div class="eyebrow">HACKATHON OPERATING SYSTEM</div><div class="title">${pageTitle()}</div><p class="subtitle">${pageSubtitle()}</p></div><div class="user"><div class="avatar">${initials}</div><div><b>${esc(me.username)}</b><br><span class="role">${esc(me.role)}</span></div><button class="btn ghost" onclick="logout()">Logout</button></div></div>${content}</main></div>`
}
function pageTitle(){return {dashboard:'Command Center',events:'Events & Tracks',judging:'Judging Control Room',workspace:'Judge Workspace',participant:'Participant Hub',gallery:'Public Gallery',integrity:'Judging Lab',api:'API & Operations'}[page]||'Arbitra'}
function pageSubtitle(){return {dashboard:'Everything happening across your hackathon, in one place.',events:'Create events, set deadlines and organize tracks.',judging:'Assignments, rubric, progress, normalization and results.',workspace:'Only the projects assigned to you. Your peers stay private.',participant:'Team up, submit your project and track your status.',gallery:'Discover projects without exposing private judging data.',integrity:'Make every important judging decision explainable and auditable.',api:'Exports, webhooks, certificates and integration surfaces.'}[page]||''}
function go(p){page=p;render()}
function eventSelect(){return `<select id="eventSel" onchange="selected=this.value;localStorage.selectedEvent=selected;render()">${events.map(e=>`<option value="${e.id}" ${e.id===selected?'selected':''}>${esc(e.name)}</option>`).join('')}</select>`}
function stats(){let e=events.find(x=>x.id===selected), ps=projects.filter(p=>p.event_id===selected);return `<div class="grid g4">
<div class="card"><div class="metric-icon">◈</div><div class="muted small">EVENTS</div><div class="stat">${events.length}</div><div class="muted small">configured locally</div></div>
<div class="card"><div class="metric-icon">▦</div><div class="muted small">PROJECTS</div><div class="stat">${ps.length}</div><div class="muted small">in selected event</div></div>
<div class="card"><div class="metric-icon">◎</div><div class="muted small">JUDGING</div><div class="stat">T2</div><div class="muted small">backend isolation enabled</div></div>
<div class="card"><div class="metric-icon">✓</div><div class="muted small">DEPLOYMENT</div><div class="stat">1 CMD</div><div class="muted small">docker compose up</div></div></div>`}
function dashboard(){return `${stats()}<div class="hero" style="margin-top:16px"><div class="eyebrow">THE CORE IDEA</div><h1>Trust the score, not the screenshot.</h1><p>Arbitra takes a hackathon from event setup to submissions, judging, normalization and publication while keeping judge-to-judge scores isolated at the backend.</p><div class="actions"><button class="btn" onclick="go('events')">Create / manage event</button><button class="btn secondary" onclick="go('judging')">Open judging room</button><button class="btn secondary" onclick="go('gallery')">View gallery</button></div></div>
<div class="grid g2" style="margin-top:16px"><div class="card"><h3>Build status</h3><div class="list"><div class="item">Authentication <span class="tag green" style="float:right">READY</span></div><div class="item">Events + tracks <span class="tag green" style="float:right">READY</span></div><div class="item">Teams + submissions <span class="tag green" style="float:right">READY</span></div><div class="item">Judging isolation <span class="tag green" style="float:right">READY</span></div><div class="item">Normalization + integrity <span class="tag amber" style="float:right">BUILD / VERIFY</span></div></div></div>
<div class="card"><h3>Selected event</h3>${eventSelect()}${selectedEventCard()}</div></div>`}
function selectedEventCard(){let e=events.find(x=>x.id===selected);if(!e)return '<p class="muted">Create an event first.</p>';return `<div style="margin-top:14px"><b>${esc(e.name)}</b><p class="muted small">${esc(e.status)} · submissions close ${fmt(e.submissions_close)}</p><div class="row">${(e.tracks||[]).map(t=>`<span class="tag">${esc(t.name)}</span>`).join('')}</div></div>`}
function eventsPage(){return `<div class="grid g2"><div class="card"><h2>Create event</h2><p class="muted">Set the dates and tracks. The backend will enforce the submission deadline.</p><label>Event name</label><input id="ename" value="DOGFOOD 2026 Demo"><label>Start</label><input id="estart" value="2026-10-01T09:00:00Z"><label>Submission deadline</label><input id="eclose" value="2026-10-03T16:00:00Z"><label>End</label><input id="eend" value="2026-10-03T18:00:00Z"><label>Tracks (comma separated)</label><input id="etracks" value="General,AI,Open Source"><button type="button" class="btn" id="createEventBtn" onclick="createEvent()">Create event</button></div>
<div class="card"><h2>Selected event</h2>${eventSelect()}${selectedEventCard()}<hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>Add track</h3><div class="row"><input id="newtrack" placeholder="Track name"><button class="btn secondary" onclick="addTrack()">Add</button></div></div></div>
<div class="card" style="margin-top:16px"><h2>Your events</h2><div class="list">${events.map(e=>`<div class="item"><div class="row"><div><b>${esc(e.name)}</b><div class="muted small">${esc(e.id)} · ${esc(e.status)}</div></div><span class="tag">${(e.tracks||[]).length} tracks</span><button class="btn secondary" onclick="selectEvent('${e.id}')">Manage</button></div></div>`).join('')||'<p class="muted">No events yet.</p>'}</div></div>`}
async function createEvent(){const btn=$('#createEventBtn');try{if(!me||me.role!=='organizer')throw Error('Organizer session required. Please sign in again.');const name=$('#ename').value.trim();const start_at=$('#estart').value.trim();const submissions_close=$('#eclose').value.trim();const end_at=$('#eend').value.trim();const tracks=$('#etracks').value.split(',').map(x=>x.trim()).filter(Boolean);if(!name)throw Error('Event name is required');if(!start_at||!submissions_close||!end_at)throw Error('All event dates are required');if(!tracks.length)throw Error('Add at least one track');btn.disabled=true;btn.textContent='Creating…';const d=await api('/api/events',{method:'POST',body:JSON.stringify({name,start_at,end_at,submissions_close,tracks})});selected=d.id;localStorage.selectedEvent=selected;await loadData();toast('Event created successfully');render()}catch(e){console.error('Arbitra create event:',e);toast(e.message||'Could not create event',false)}finally{const b=$('#createEventBtn');if(b){b.disabled=false;b.textContent='Create event'}}}
async function addTrack(){if(!selected)return toast('Select an event first',false);try{await api(`/api/events/${selected}/tracks`,{method:'POST',body:JSON.stringify({name:$('#newtrack').value})});await loadData();toast('Track added');render()}catch(e){toast(e.message,false)}}
function selectEvent(id){selected=id;localStorage.selectedEvent=id;render()}
function judgingPage(){return `<div class="card"><div class="row"><div style="flex:2"><h2>Judging Control Room</h2><p class="muted">Manage the rubric, assignments, progress and final score pipeline.</p></div>${eventSelect()}</div></div>
<div class="grid g3" style="margin-top:16px"><div class="card"><h3>1 · Rubric</h3><p class="muted small">The supplied DOGFOOD weighting.</p><textarea id="rubric" rows="6">Tier Completion & Correctness,40
Judging Integrity,25
Adoptability & Operability,20
Code Quality & Innovation,15</textarea><button class="btn" onclick="saveRubric()">Save rubric</button></div>
<div class="card"><h3>2 · Assign judges</h3><p class="muted small">Pick a judge and one or more projects.</p><select id="judge"></select><div id="projectChecks" class="list" style="max-height:180px;overflow:auto"></div><button class="btn" onclick="assignJudge()">Assign selected</button></div>
<div class="card"><h3>3 · Pipeline</h3><button class="btn secondary" onclick="loadProgress()">Refresh progress</button><button class="btn secondary" onclick="normalize()">Run normalization</button><button class="btn secondary" onclick="publish()">Publish results</button><button class="btn secondary" onclick="csv()">Export CSV</button><div id="progress" style="margin-top:12px"></div></div></div>
<div class="card" style="margin-top:16px"><h2>Assignments</h2><div id="assignments"></div></div>`}
async function initJudging(){try{let u=await api('/api/users');$('#judge').innerHTML=u.filter(x=>['judge','judge_a','judge_b'].includes(x.role)).map(x=>`<option value="${x.username}">${x.username}</option>`).join('');let p=projects.filter(x=>x.event_id===selected);$('#projectChecks').innerHTML=p.map(x=>`<label class="item"><input type="checkbox" value="${x.id}" style="width:auto"> ${esc(x.title)} <span class="muted small">${x.id}</span></label>`).join('')||'<div class="muted">No projects.</div>';await loadAssignments()}catch(e){toast(e.message,false)}}
async function saveRubric(){try{let criteria=$('#rubric').value.split('\\n').filter(Boolean).map(x=>{let [name,weight]=x.split(',');return{name:name.trim(),weight:+weight,max_score:10}});await api('/api/rubric',{method:'POST',body:JSON.stringify({event_id:selected,criteria})});toast('Rubric saved')}catch(e){toast(e.message,false)}}
async function assignJudge(){try{let ids=[...document.querySelectorAll('#projectChecks input:checked')].map(x=>x.value);if(!ids.length)return toast('Select at least one project',false);await api('/api/judges/assign',{method:'POST',body:JSON.stringify({event_id:selected,judge_id:$('#judge').value,project_ids:ids})});toast('Assignments created');loadAssignments()}catch(e){toast(e.message,false)}}
async function loadAssignments(){let a=await api('/api/judges/assignments?event_id='+encodeURIComponent(selected));$('#assignments').innerHTML=a.map(x=>`<span class="tag" style="margin:3px">${esc(x.judge_id)} → ${esc(x.project_id)}</span>`).join('')||'<span class="muted">No assignments yet.</span>'}
async function loadProgress(){try{let d=await api('/api/judging/progress?event_id='+encodeURIComponent(selected));$('#progress').innerHTML=d.judges.map(x=>`<div style="margin:10px 0"><div class="row"><span>${esc(x.judge_id)}</span><span class="muted">${x.scored}/${x.assigned} projects</span></div><div class="progress"><span style="width:${x.percent}%"></span></div></div>`).join('')||'<span class="muted">No assignments.</span>'}catch(e){toast(e.message,false)}}
async function normalize(){try{let d=await api('/api/normalize',{method:'POST',body:JSON.stringify({event_id:selected})});toast('Normalization proof generated');$('#progress').innerHTML='<div class="notice success"><b>Normalization proof</b><br>Method: '+esc(d.method)+'<br>Proof hash: <code>'+esc(d.proof_hash)+'</code></div><pre style="white-space:pre-wrap;color:#b8c1da;margin-top:10px">'+esc(JSON.stringify(d.results,null,2))+'</pre>'}catch(e){toast(e.message,false)}}
async function publish(){try{await api('/api/events/'+selected+'/publish',{method:'POST'});toast('Results published')}catch(e){toast(e.message,false)}}
async function csv(){try{let r=await fetch('/api/csv-export?event_id='+selected,{credentials:'same-origin'});let t=await r.text();let blob=new Blob([t],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='arbitra-results.csv';a.click();toast('CSV downloaded')}catch(e){toast(e.message,false)}}
function workspacePage(){return `<div class="card"><div class="row"><div><h2>Your assignments</h2><p class="muted">Peer scores are not exposed to you by the backend.</p></div><button class="btn secondary" onclick="loadMyAssignments()">Refresh</button></div><div id="myAssignments"></div></div>`}
async function loadMyAssignments(){let a=await api('/api/judges/assignments?event_id='+selected);let r=await api('/api/rubric?event_id='+selected);$('#myAssignments').innerHTML=a.map(x=>`<div class="card"><h3>${esc(x.project_id)}</h3><p class="muted">Assigned to you</p>${r.map(c=>`<label>${esc(c.name)} · ${c.weight}%<input id="s_${x.project_id}_${c.id}" type="number" min="0" max="${c.max_score}" step=".1" placeholder="0–${c.max_score}"></label>`).join('')}<button class="btn" onclick="submitScores('${x.project_id}')">Save scores</button></div>`).join('')||'<p class="muted">No assignments yet.</p>'}
async function submitScores(pid){try{let r=await api('/api/rubric?event_id='+selected),scores={};r.forEach(c=>scores[c.name]=+document.querySelector('#s_'+pid+'_'+c.id).value);let d=await api('/api/scores/weighted',{method:'POST',body:JSON.stringify({event_id:selected,project_id:pid,scores})});toast('Score saved · receipt '+d.receipt_id)}catch(e){toast(e.message,false)}}
function participantPage(){return `<div class="grid g2"><div class="card"><h2>Team</h2><label>Event</label>${eventSelect()}<label>Team name</label><input id="teamName" placeholder="Your team"><button class="btn" onclick="createTeam()">Create team</button><div id="teamBox" style="margin-top:12px"></div></div>
<div class="card"><h2>Invite teammate</h2><p class="muted small">Create a link token after you create your team.</p><button class="btn secondary" onclick="createInvite()">Create invite</button><div id="inviteBox" style="margin-top:12px"></div></div></div>
<div class="card" style="margin-top:16px"><h2>Project submission</h2><p class="muted">You can edit until the event's actual submission deadline. The backend enforces the deadline.</p><label>Project title</label><input id="ptitle" placeholder="Project name"><label>Description</label><textarea id="pdesc" rows="5" placeholder="What did you build?"></textarea><label>Repository URL</label><input id="repo" placeholder="https://github.com/..."><label>Demo URL</label><input id="demo" placeholder="https://..."><button class="btn" onclick="submitProject()">Save submission</button></div>`}
async function createTeam(){try{let d=await api('/api/teams',{method:'POST',body:JSON.stringify({event_id:selected,name:$('#teamName').value})});toast('Team created');await teamInfo();localStorage.team=d.team_id}catch(e){toast(e.message,false)}}
async function createInvite(){try{let t=localStorage.team;if(!t){let d=await api('/api/my-team');t=d.team?.id}if(!t)return toast('Create a team first',false);let d=await api('/api/teams/'+t+'/invite',{method:'POST'});$('#inviteBox').innerHTML=`<div class="notice success"><b>Invite token</b><br><code>${esc(d.invite_token)}</code><br><span class="small">Share this token with your teammate.</span></div>`}catch(e){toast(e.message,false)}}
async function teamInfo(){let d=await api('/api/my-team');$('#teamBox').innerHTML='<pre style="white-space:pre-wrap;color:#b8c1da">'+esc(JSON.stringify(d,null,2))+'</pre>'}
async function submitProject(){try{await api('/api/submit',{method:'POST',body:JSON.stringify({event_id:selected,title:$('#ptitle').value,description:$('#pdesc').value,status:'SUBMITTED'})});toast('Submission saved');await loadData()}catch(e){toast(e.message,false)}}
function galleryPage(){return `<div class="card"><div class="row"><input id="gq" placeholder="Search projects..." oninput="filterGallery()"><select id="gtrack" onchange="filterGallery()"><option value="">All tracks</option>${(events.find(e=>e.id===selected)?.tracks||[]).map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div><div id="galleryGrid" class="grid g3" style="margin-top:16px"></div></div>`}
function renderGallery(){let q=($('#gq')?.value||'').toLowerCase(),tr=$('#gtrack')?.value||'',ps=projects.filter(p=>p.event_id===selected&&(!q||(p.title+' '+p.description).toLowerCase().includes(q))&&(!tr||p.track_id===tr));$('#galleryGrid').innerHTML=ps.map(p=>`<article class="card"><span class="tag">PROJECT</span><h3>${esc(p.title)}</h3><p class="muted">${esc(p.description||'No description')}</p><div class="actions"><button class="btn ghost" onclick="vote('${p.id}')">Community vote</button></div></article>`).join('')||'<div class="muted">No projects match.</div>'}
function filterGallery(){renderGallery()}
async function vote(pid){try{let email=prompt('Email for one-vote-per-person gating:');if(!email)return;await api('/api/votes',{method:'POST',body:JSON.stringify({event_id:selected,project_id:pid,email})});toast('Vote recorded')}catch(e){toast(e.message,false)}}
function integrityPage(){return `<div class="grid g4"><div class="card"><div class="eyebrow">SECURITY</div><h2>Judge isolation</h2><p class="muted">Peer scores are blocked server-side.</p><span class="tag green">BACKEND ENFORCED</span></div><div class="card"><div class="eyebrow">PROOF</div><h2>Score receipts</h2><p class="muted">Every submitted score set gets a deterministic receipt hash.</p><button class="btn secondary" onclick="loadReceipts()">View receipts</button></div><div class="card"><div class="eyebrow">NORMALIZATION</div><h2>Normalization proof</h2><p class="muted">Reproducible weighted scores with a documented method.</p><button class="btn secondary" onclick="showLatestNormalization()">Open proof</button></div><div class="card"><div class="eyebrow">PUBLISHING</div><h2>Immutable snapshot</h2><p class="muted">Published results are captured with a snapshot hash.</p><button class="btn secondary" onclick="showPublished()">Verify snapshot</button></div></div>
<div class="grid g2" style="margin-top:16px"><div class="card"><div class="row"><div><h2>Assignment quality</h2><p class="muted">Coverage and workload warnings before judging closes.</p></div><button class="btn secondary" onclick="assignmentHealth()">Run check</button></div><div id="assignmentHealth" class="notice">No check run yet.</div></div><div class="card"><div class="row"><div><h2>Event health</h2><p class="muted">One-screen operational readiness check.</p></div><button class="btn secondary" onclick="eventHealth()">Run check</button></div><div id="eventHealth" class="notice">No check run yet.</div></div></div>
<div class="card" style="margin-top:16px"><div class="row"><div><h2>Judge Calibration Lab</h2><p class="muted">Three deterministic sample projects. Score independently, then compare disagreement before live judging.</p></div><button class="btn" onclick="runCalibration()">Run calibration</button></div><div id="calibration" style="margin-top:12px"></div></div>
<div class="card" style="margin-top:16px"><div class="row"><div><h2>What-if Judging</h2><p class="muted">Explore hypothetical score changes without modifying stored scores or results.</p></div><button class="btn secondary" onclick="loadWhatIf()">Open simulator</button></div><div id="whatif" style="margin-top:12px"></div></div>
<div class="card" style="margin-top:16px"><div class="row"><div><h2>Acceptance Checker</h2><p class="muted">Run a local contract-style readiness check before the demo.</p></div><button class="btn" onclick="runAcceptance()">Run checks</button></div><div id="acceptance" style="margin-top:12px"></div></div>
<div class="grid g2" style="margin-top:16px">
<div class="card"><div class="row"><div><h2>Blind Judging</h2><p class="muted">Hide team identity from judges while preserving organizer visibility.</p></div><button class="btn secondary" onclick="toggleBlind()">Toggle</button></div><div id="blindState" class="notice">Loading…</div></div>
<div class="card"><div class="row"><div><h2>Rubric Version History</h2><p class="muted">Every rubric change is preserved as a version.</p></div><button class="btn secondary" onclick="rubricHistory()">View history</button></div><div id="rubricHistory" class="list" style="margin-top:10px"></div></div>
</div>
<div class="grid g2" style="margin-top:16px">
<div class="card"><div class="row"><div><h2>Judge Work Queue</h2><p class="muted">Assigned → in progress → submitted, with explicit score locking.</p></div><button class="btn secondary" onclick="workQueue()">Open queue</button></div><div id="workQueue" class="list" style="margin-top:10px"></div></div>
<div class="card"><div class="row"><div><h2>Judge Reliability</h2><p class="muted">Operational completion metrics, not a judge ranking.</p></div><button class="btn secondary" onclick="reliability()">View metrics</button></div><div id="reliability" class="list" style="margin-top:10px"></div></div>
</div>
<div class="grid g2" style="margin-top:16px">
<div class="card"><h2>Conflict of Interest</h2><p class="muted">Declare a conflict to remove a judge from that project's assignment.</p><div class="row"><input id="conflictProject" placeholder="Project ID"><input id="conflictJudge" placeholder="Judge ID (optional)"></div><input id="conflictReason" placeholder="Reason"><button class="btn secondary" style="margin-top:8px" onclick="declareConflict()">Declare conflict</button><div id="conflicts" class="list" style="margin-top:10px"></div></div>
<div class="card"><h2>Appeals & Review</h2><p class="muted">Appeals create a separate review record; original scores remain intact.</p><button class="btn secondary" onclick="loadAppeals()">View appeals</button><div id="appeals" class="list" style="margin-top:10px"></div></div>
</div>
<div class="grid g2" style="margin-top:16px">
<div class="card"><h2>Project Comparison</h2><p class="muted">Compare two projects against the same rubric without ranking them.</p><div class="row"><input id="compareA" placeholder="Project A ID"><input id="compareB" placeholder="Project B ID"></div><button class="btn secondary" style="margin-top:8px" onclick="compareProjects()">Compare</button><div id="compareOut" style="margin-top:10px"></div></div>
<div class="card"><h2>Reproducibility Package</h2><p class="muted">Export the event's submissions, assignments, scores, receipts, normalization, publication and audit evidence.</p><button class="btn" onclick="exportEvidence()">Export Judging Evidence</button><button class="btn secondary" style="margin-left:8px" onclick="timeline()">Decision timeline</button><div id="timelineOut" class="list" style="margin-top:10px"></div></div>
</div>
<div class="card" style="margin-top:16px"><h2>Threat model</h2><div class="list"><div class="item"><b>Peer-score access</b><br><span class="muted">Mitigation: server-side identity filtering + 403 response.</span></div><div class="item"><b>Late submissions</b><br><span class="muted">Mitigation: backend deadline enforcement.</span></div><div class="item"><b>Duplicate community voting</b><br><span class="muted">Mitigation: voter identity hash + uniqueness check + rate limit.</span></div></div></div><div id="auditBox" style="margin-top:16px"></div>`}
async function loadReceipts(){try{let d=await api('/api/score-receipts?event_id='+selected);$('#auditBox').innerHTML='<div class="card"><h2>Score receipts</h2>'+(d.length?'<table class="table"><tr><th>Project</th><th>Judge</th><th>Total</th><th>Rubric</th><th>Receipt hash</th></tr>'+d.map(r=>`<tr><td>${esc(r.project_id)}</td><td>${esc(r.judge_id)}</td><td>${r.weighted_total}</td><td>${esc(r.rubric_version)}</td><td><code>${esc(r.hash.slice(0,18))}…</code></td></tr>`).join('')+'</table>':'<p class="muted">No score receipts yet.</p>')+'</div>'}catch(e){toast(e.message,false)}}
async function showLatestNormalization(){try{let d=await api('/api/normalize/latest?event_id='+selected);if(!d.run)return toast('Run normalization first',false);$('#auditBox').innerHTML='<div class="card"><h2>Normalization proof</h2><p class="muted">'+esc(d.method)+'</p><p><span class="tag green">PROOF HASH</span> <code>'+esc(d.proof_hash)+'</code></p><pre style="white-space:pre-wrap;color:#b8c1da">'+esc(JSON.stringify(d.results,null,2))+'</pre></div>'}catch(e){toast(e.message,false)}}
async function showPublished(){try{let d=await api('/api/published/'+selected);$('#auditBox').innerHTML='<div class="card"><h2>Published snapshot</h2><p><span class="tag green">IMMUTABLE SNAPSHOT</span></p><p>Snapshot: <code>'+esc(d.snapshot_id)+'</code></p><p>Hash: <code>'+esc(d.snapshot_hash)+'</code></p></div>'}catch(e){toast(e.message,false)}}
async function assignmentHealth(){try{let d=await api('/api/assignment-health?event_id='+selected);$('#assignmentHealth').innerHTML=`<b>${d.assignments} assignments</b> · ${d.judges} judges · ${d.projects} projects<br><span class="muted">${d.issues.length?d.issues.map(x=>esc(x.detail)).join(' · '):'No coverage or workload warnings.'}</span>`}catch(e){toast(e.message,false)}}
async function eventHealth(){try{let d=await api('/api/event-health?event_id='+selected);$('#eventHealth').innerHTML=`<b>${esc(d.overall)}</b><br><span class="muted">Projects ${d.checks.projects} · Assignments ${d.checks.assignments} · Scores ${d.checks.scores} · Normalization ${d.checks.normalization?'ready':'pending'} · Published ${d.checks.published?'yes':'no'}</span>`}catch(e){toast(e.message,false)}}
function runCalibration(){const samples=[['Atlas','7.5'],['Signal','8.5'],['Forge','6.5']];$('#calibration').innerHTML='<div class="grid g3">'+samples.map((x,i)=>`<div class="item"><b>${x[0]}</b><label>Judge A<input id="calA${i}" type="number" min="0" max="10" value="${x[1]}" step="0.5"></label><label>Judge B<input id="calB${i}" type="number" min="0" max="10" value="${(+x[1]+(i===1?-1:1)).toFixed(1)}" step="0.5"></label></div>`).join('')+'</div><button class="btn" style="margin-top:12px" onclick="compareCalibration()">Compare judges</button>'}
function compareCalibration(){let diffs=[0,1,2].map(i=>Math.abs(+$('#calA'+i).value-+$('#calB'+i).value));let avg=diffs.reduce((a,b)=>a+b,0)/diffs.length;$('#calibration').insertAdjacentHTML('beforeend',`<div class="notice success" style="margin-top:12px"><b>Calibration complete.</b> Average disagreement: ${avg.toFixed(2)} points. Use this to discuss scoring alignment before live judging.</div>`)}
async function loadWhatIf(){try{let d=await api('/api/score-receipts?event_id='+selected);$('#whatif').innerHTML='<label>Hypothetical adjustment to every receipt</label><input id="whatIfDelta" type="number" value="0" step="1" min="-20" max="20"><button class="btn secondary" style="margin-top:10px" onclick="applyWhatIf()">Preview change</button><div id="whatifResults" style="margin-top:12px"><span class="muted">Stored results are unchanged.</span></div>';window.__receipts=d}catch(e){toast(e.message,false)}}
function applyWhatIf(){let delta=+(document.getElementById('whatIfDelta').value||0),rs=window.__receipts||[];document.getElementById('whatifResults').innerHTML=rs.map(r=>`<div class="item" style="margin:6px 0"><b>${esc(r.project_id)}</b> · ${esc(r.judge_id)}: ${r.weighted_total} → <strong>${Math.max(0,Math.min(100,r.weighted_total+delta)).toFixed(2)}</strong></div>`).join('')||'<span class="muted">No receipts yet.</span>'}
async function runAcceptance(){try{let d=await api('/api/acceptance-check');$('#acceptance').innerHTML=`<div class="notice ${d.passed===d.total?'success':'error'}"><b>${d.passed}/${d.total} checks passing</b></div><div class="list" style="margin-top:10px">${d.checks.map(c=>`<div class="item"><span class="tag ${c.pass?'green':'red'}">${c.pass?'PASS':'FAIL'}</span> ${esc(c.name)} — ${esc(c.detail)}</div>`).join('')}</div>`}catch(e){toast(e.message,false)}}

async function toggleBlind(){try{let cur=await api('/api/event-settings?event_id='+selected);let d=await api('/api/event-settings',{method:'POST',body:JSON.stringify({event_id:selected,blind_judging:!cur.blind_judging})});$('#blindState').innerHTML='<b>'+ (d.blind_judging?'ON':'OFF')+'</b> · '+(d.blind_judging?'Judge-facing identity is masked.':'Judge-facing identity is visible.')}catch(e){toast(e.message,false)}}
async function rubricHistory(){try{let d=await api('/api/rubric/history?event_id='+selected);$('#rubricHistory').innerHTML=d.length?d.map(x=>`<div class="item"><b>${esc(x.version)}</b> · ${fmt(x.created_at)}<br><span class="muted">${esc(x.criteria.map(c=>c.name+' '+c.weight+'%').join(' · '))}</span></div>`).join(''):'<span class="muted">No versions yet.</span>'}catch(e){toast(e.message,false)}}
async function workQueue(){try{let d=await api('/api/judge-work-queue?event_id='+selected);$('#workQueue').innerHTML=d.length?d.map(x=>`<div class="item"><b>${esc(x.title)}</b> <span class="tag">${esc(x.status)}</span><br><span class="muted">${esc(x.project_id)}</span></div>`).join(''):'<span class="muted">No assignments.</span>'}catch(e){toast(e.message,false)}}
async function reliability(){try{let d=await api('/api/judge-reliability?event_id='+selected);$('#reliability').innerHTML=d.length?d.map(x=>`<div class="item"><b>${esc(x.judge_id)}</b> · ${x.completion}% completion · ${x.submitted}/${x.assigned} submitted</div>`).join(''):'<span class="muted">No assignments.</span>'}catch(e){toast(e.message,false)}}
async function declareConflict(){try{let d=await api('/api/conflicts',{method:'POST',body:JSON.stringify({event_id:selected,project_id:$('#conflictProject').value.trim(),judge_id:$('#conflictJudge').value.trim()||undefined,reason:$('#conflictReason').value.trim()})});toast('Conflict recorded and assignment removed');loadConflicts()}catch(e){toast(e.message,false)}}
async function loadConflicts(){try{let d=await api('/api/conflicts?event_id='+selected);$('#conflicts').innerHTML=d.length?d.map(x=>`<div class="item"><b>${esc(x.judge_id)}</b> → ${esc(x.project_id)}<br><span class="muted">${esc(x.reason)}</span></div>`).join(''):'<span class="muted">No conflicts declared.</span>'}catch(e){toast(e.message,false)}}
async function loadAppeals(){try{let d=await api('/api/appeals?event_id='+selected);$('#appeals').innerHTML=d.length?d.map(x=>`<div class="item"><b>${esc(x.id)}</b> · ${esc(x.status)}<br>${esc(x.project_id)} — ${esc(x.reason)}</div>`).join(''):'<span class="muted">No appeals.</span>'}catch(e){toast(e.message,false)}}
async function compareProjects(){try{let d=await api('/api/project-compare?event_id='+selected+'&project_a='+encodeURIComponent($('#compareA').value)+'&project_b='+encodeURIComponent($('#compareB').value));$('#compareOut').innerHTML='<table class="table"><tr><th>Criterion</th><th>A</th><th>B</th></tr>'+d.criteria.map(x=>`<tr><td>${esc(x.criterion)}</td><td>${x.a??'—'}</td><td>${x.b??'—'}</td></tr>`).join('')+'</table>'}catch(e){toast(e.message,false)}}
async function exportEvidence(){try{let d=await api('/api/reproducibility/'+selected);let blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='arbitra-'+selected+'-judging-evidence.json';a.click();URL.revokeObjectURL(a.href);toast('Evidence package exported')}catch(e){toast(e.message,false)}}
async function timeline(){try{let d=await api('/api/decision-timeline?event_id='+selected);$('#timelineOut').innerHTML=d.length?d.map(x=>`<div class="item"><b>${esc(x.action)}</b><br><span class="muted">${esc(x.actor)} · ${fmt(x.created_at)}</span></div>`).join(''):'<span class="muted">No decision events yet.</span>'}catch(e){toast(e.message,false)}}

async function audit(){try{let d=await api('/api/audit?event_id='+selected);$('#auditBox').innerHTML='<div class="card"><h2>Audit log</h2><table class="table"><tr><th>Action</th><th>Actor</th><th>Object</th><th>Time</th></tr>'+d.map(x=>`<tr><td>${esc(x.action)}</td><td>${esc(x.actor)}</td><td>${esc(x.object)}</td><td>${fmt(x.created_at)}</td></tr>`).join('')+'</table></div>'}catch(e){toast(e.message,false)}}
function apiPage(){return `<div class="grid g2"><div class="card"><h2>Data export</h2><p class="muted">Move your event data out of Arbitra.</p><button class="btn" onclick="csv()">Download judging CSV</button><button class="btn secondary" onclick="bulk()">View bulk JSON</button></div><div class="card"><h2>Webhook</h2><label>Event</label>${eventSelect()}<label>Webhook URL</label><input id="whurl" placeholder="http://localhost:9000/webhook"><button class="btn" onclick="webhook()">Register webhook</button><div id="whout"></div></div></div><div class="card" style="margin-top:16px"><h2>Embeddable gallery</h2><p class="muted">The gallery can be embedded using the local endpoint.</p><code>/embed/gallery?event_id=${esc(selected)}</code></div>`}
async function bulk(){let d=await api('/api/bulk/export');let w=window.open();w.document.write('<pre>'+esc(JSON.stringify(d,null,2))+'</pre>')}
async function webhook(){try{let d=await api('/api/webhooks',{method:'POST',body:JSON.stringify({event_id:selected,url:$('#whurl').value})});$('#whout').innerHTML='<div class="notice success">Webhook registered. Secret: '+esc(d.secret)+'</div>'}catch(e){toast(e.message,false)}}
function render(){if(!me){login();return}let c=page==='dashboard'?dashboard():page==='events'?eventsPage():page==='judging'?judgingPage():page==='workspace'?workspacePage():page==='participant'?participantPage():page==='gallery'?galleryPage():page==='integrity'?integrityPage():apiPage();root.innerHTML=shell(c);if(page==='judging')initJudging();if(page==='workspace')loadMyAssignments();if(page==='participant')teamInfo().catch(()=>{});if(page==='gallery')renderGallery();if(page==='integrity'){toggleBlind().catch(()=>{});loadConflicts().catch(()=>{})}}
boot();
</script>
</body></html>
